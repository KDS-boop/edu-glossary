<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>Ilustrasi ancaman ransomware di sistem komputer</title>
  <desc>Perisai yang retak dan dikunci rantai penguncian — menggambarkan ransomware mengenkripsi data dan menuntut pembayaran.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- jaringan circuit latar -->
  <g stroke="#24304a" stroke-width="1.5" opacity="0.55">
    <path d="M 60 540 H 300 V 380" fill="none"/>
    <path d="M 40 120 H 240 V 240" fill="none"/>
    <path d="M 1150 100 H 940 V 220" fill="none"/>
    <path d="M 1160 520 H 980 V 420" fill="none"/>
    <circle cx="60" cy="540" r="4" fill="#24304a" stroke="none"/>
    <circle cx="40" cy="120" r="4" fill="#24304a" stroke="none"/>
    <circle cx="1150" cy="100" r="4" fill="#24304a" stroke="none"/>
    <circle cx="1160" cy="520" r="4" fill="#24304a" stroke="none"/>
  </g>

  <!-- perisai dengan retakan -->
  <path d="M 700 120 L 850 170 V 300 C 850 400 790 470 700 500 C 610 470 550 400 550 300 V 170 Z" fill="url(#shieldGrad)" opacity="0.97"/>
  <path d="M 700 138 L 832 182 V 298 C 832 386 780 448 700 476 C 620 448 568 386 568 298 V 182 Z" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
  <!-- retakan pada perisai -->
  <path d="M 690 150 L 712 210 L 686 250 L 718 300 L 694 352 L 720 412 L 702 470" fill="none" stroke="#dc2626" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- tanda silang di atas retakan -->
  <g stroke="#dc2626" stroke-width="7" stroke-linecap="round">
    <line x1="736" y1="222" x2="760" y2="246"/>
    <line x1="760" y1="222" x2="736" y2="246"/>
  </g>

  <!-- ikon kunci di dalam perisai -->
  <g transform="translate(640, 320)">
    <rect x="0" y="24" width="56" height="44" rx="10" fill="#dc2626"/>
    <path d="M 12 24 V 14 A 16 16 0 0 1 44 14 V 24" fill="none" stroke="#dc2626" stroke-width="9"/>
    <circle cx="28" cy="42" r="7" fill="#0a1220"/>
    <rect x="25" y="44" width="6" height="14" rx="3" fill="#0a1220"/>
  </g>

  <!-- rantai mengunci perisai (kiri) -->
  <g>
    <rect x="140" y="238" width="50" height="36" rx="9" fill="none" stroke="#94a3b8" stroke-width="10"/>
    <rect x="200" y="238" width="50" height="36" rx="9" fill="none" stroke="#64748b" stroke-width="10"/>
    <rect x="260" y="238" width="50" height="36" rx="9" fill="none" stroke="#94a3b8" stroke-width="10"/>
    <!-- gembok di ujung rantai -->
    <rect x="300" y="228" width="64" height="52" rx="10" fill="#dc2626"/>
    <path d="M 314 228 V 212 A 18 18 0 0 1 350 212 V 228" fill="none" stroke="#dc2626" stroke-width="11"/>
    <circle cx="332" cy="248" r="7" fill="#0a1220"/>
    <rect x="329" y="250" width="6" height="15" rx="3" fill="#0a1220"/>
  </g>

  <!-- kartu notifikasi tebusan (kiri bawah) -->
  <g>
    <rect x="130" y="400" width="300" height="130" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 175 448 L 195 415 L 215 448 Z" fill="#dc2626"/>
    <rect x="192" y="427" width="6" height="11" rx="3" fill="#0f172a"/>
    <rect x="192" y="441" width="6" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="236" y="424" width="150" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="236" y="444" width="110" height="8" rx="4" fill="#64748b"/>
    <rect x="150" y="472" width="130" height="34" rx="8" fill="#dc2626"/>
    <circle cx="172" cy="489" r="9" fill="#0a1220"/>
    <rect x="169" y="491" width="6" height="10" rx="3" fill="#0a1220"/>
    <path d="M 163 489 v -4 a 9 9 0 0 1 18 0 v 4" fill="none" stroke="#0a1220" stroke-width="4"/>
    <rect x="188" y="484" width="76" height="10" rx="5" fill="#fecaca"/>
    <rect x="150" y="512" width="80" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- ikon folder terkunci (kanan atas) -->
  <g transform="translate(920, 130)">
    <path d="M 0 24 L 0 0 L 44 0 L 60 20 L 160 20 L 160 120 L 0 120 Z" fill="#334155"/>
    <path d="M 0 40 L 160 40 L 160 120 L 0 120 Z" fill="#475569"/>
    <rect x="58" y="58" width="44" height="36" rx="8" fill="#f8fafc"/>
    <path d="M 67 58 V 46 A 13 13 0 0 1 93 46 V 58" fill="none" stroke="#f8fafc" stroke-width="7"/>
  </g>

  <!-- ikon disk encrypted (kanan bawah) -->
  <g transform="translate(940, 380)">
    <circle cx="70" cy="70" r="64" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <circle cx="70" cy="70" r="14" fill="#94a3b8"/>
    <path d="M 70 26 A 44 44 0 0 1 114 70" fill="none" stroke="#dc2626" stroke-width="8" stroke-dasharray="14 10"/>
    <rect x="48" y="48" width="44" height="36" rx="8" fill="#dc2626"/>
    <path d="M 58 48 V 38 A 12 12 0 0 1 82 38 V 48" fill="none" stroke="#dc2626" stroke-width="8"/>
    <circle cx="70" cy="64" r="6" fill="#0a1220"/>
    <rect x="67" y="66" width="6" height="12" rx="3" fill="#0a1220"/>
  </g>

  <!-- chip pengunci (kanan tengah) -->
  <g transform="translate(1010, 250)">
    <rect x="0" y="0" width="84" height="84" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="18" y="18" width="48" height="48" rx="8" fill="#0f172a"/>
    <g stroke="#475569" stroke-width="5" stroke-linecap="round">
      <line x1="-12" y1="22" x2="0" y2="22"/>
      <line x1="-12" y1="42" x2="0" y2="42"/>
      <line x1="-12" y1="62" x2="0" y2="62"/>
      <line x1="84" y1="22" x2="96" y2="22"/>
      <line x1="84" y1="42" x2="96" y2="42"/>
      <line x1="84" y1="62" x2="96" y2="62"/>
      <line x1="22" y1="-12" x2="22" y2="0"/>
      <line x1="42" y1="-12" x2="42" y2="0"/>
      <line x1="62" y1="-12" x2="62" y2="0"/>
      <line x1="22" y1="84" x2="22" y2="96"/>
      <line x1="42" y1="84" x2="42" y2="96"/>
      <line x1="62" y1="84" x2="62" y2="96"/>
    </g>
    <rect x="30" y="34" width="24" height="21" rx="5" fill="#dc2626"/>
    <path d="M 35 34 V 28 A 7 7 0 0 1 49 28 V 34" fill="none" stroke="#dc2626" stroke-width="5"/>
    <circle cx="42" cy="43" r="3.5" fill="#0a1220"/>
  </g>

  <!-- partikel + tanda dolar tebaran (efek sandi) -->
  <g fill="#dc2626" opacity="0.55" font-family="system-ui, -apple-system, 'Poppins UI', sans-serif" font-weight="700" font-size="22">
    <text x="480" y="150">$</text>
    <text x="520" y="520">%</text>
    <text x="440" y="270">#</text>
    <text x="880" y="480">$</text>
    <text x="1090" y="180">!</text>
    <text x="1060" y="560">$</text>
  </g>
  <g opacity="0.4" fill="#94a3b8">
    <circle cx="470" cy="380" r="5"/>
    <circle cx="380" cy="160" r="4"/>
    <circle cx="1120" cy="330" r="5"/>
    <circle cx="870" cy="540" r="4"/>
    <circle cx="60" cy="330" r="4"/>
  </g>
</svg>