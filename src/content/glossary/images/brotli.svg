<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Brotli compression</title><desc id="desc">Data blocks are compacted through a compression pipeline and restored by a protected decoder.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1c36"/><stop offset="1" stop-color="#10445a"/></linearGradient></defs><rect width="1200" height="630" rx="24" fill="url(#bg)"/><text x="70" y="90" fill="#6be0d3" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">SOFTWARE DEVELOPMENT</text><text x="70" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Brotli Compression</text><g transform="translate(95 235)"><rect width="250" height="195" rx="20" fill="#123954" stroke="#58cddd" stroke-width="3"/><g fill="#5ddfd3"><rect x="35" y="35" width="35" height="35" rx="6"/><rect x="80" y="35" width="35" height="35" rx="6"/><rect x="125" y="35" width="35" height="35" rx="6"/><rect x="170" y="35" width="35" height="35" rx="6"/><rect x="35" y="80" width="35" height="35" rx="6"/><rect x="80" y="80" width="35" height="35" rx="6"/><rect x="125" y="80" width="35" height="35" rx="6"/><rect x="170" y="80" width="35" height="35" rx="6"/></g><text x="125" y="155" fill="#eaffff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">ORIGINAL DATA</text></g><path d="M375 331H453" stroke="#68e6d8" stroke-width="8" stroke-linecap="round"/><path d="M433 313L457 331L433 349" fill="none" stroke="#68e6d8" stroke-width="8" stroke-linecap="round"/><g transform="translate(480 250)"><rect width="240" height="165" rx="20" fill="#194866" stroke="#55dfd4" stroke-width="3"/><path d="M40 58H200M40 82H175M40 106H145" stroke="#64dfd3" stroke-width="11" stroke-linecap="round"/><text x="120" y="140" fill="#e4fbff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">COMPRESSED STREAM</text></g><path d="M750 331H828" stroke="#68e6d8" stroke-width="8" stroke-linecap="round"/><path d="M808 313L832 331L808 349" fill="none" stroke="#68e6d8" stroke-width="8" stroke-linecap="round"/><g transform="translate(855 235)"><rect width="250" height="195" rx="20" fill="#103d4d" stroke="#5ce0bd" stroke-width="3"/><path d="M125 30L166 47V83C166 109 147 126 125 138C103 126 84 109 84 83V47Z" fill="#56dcca"/><path d="M103 82L118 97L148 65" fill="none" stroke="#0c3a49" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="167" fill="#efffff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">SAFE DECODER</text></g><text x="70" y="515" fill="#c6e4ed" font-family="Arial, sans-serif" font-size="22">Compression saves bytes; secure parsing protects the application.</text></svg>
