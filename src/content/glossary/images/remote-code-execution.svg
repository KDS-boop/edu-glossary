<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Remote code execution</title><desc id="desc">A remote request approaches a protected application boundary, illustrating why input validation and least privilege matter.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091b35"/><stop offset="1" stop-color="#174761"/></linearGradient></defs><rect width="1200" height="630" rx="24" fill="url(#bg)"/><text x="70" y="90" fill="#69e3d2" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">CYBERSECURITY GLOSSARY</text><text x="70" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Remote Code Execution</text><g transform="translate(95 245)"><rect width="220" height="190" rx="18" fill="#102e4b" stroke="#4fb9d7" stroke-width="3"/><circle cx="110" cy="60" r="31" fill="#4fb9d7"/><path d="M81 60L102 80L140 38" fill="none" stroke="#09243b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="126" fill="#e8f8ff" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">REMOTE INPUT</text><text x="110" y="157" fill="#94c2d4" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Request / payload</text></g><path d="M340 338H420" stroke="#5ce0d1" stroke-width="8" stroke-linecap="round"/><path d="M400 320L424 338L400 356" fill="none" stroke="#5ce0d1" stroke-width="8" stroke-linecap="round"/><g transform="translate(445 235)"><rect width="245" height="210" rx="18" fill="#4a2636" stroke="#f49b72" stroke-width="3"/><path d="M122 36L165 112H79Z" fill="#ffb66d"/><rect x="117" y="59" width="10" height="30" rx="5" fill="#4b2d22"/><circle cx="122" cy="99" r="5" fill="#4b2d22"/><text x="122" y="145" fill="#fff0e7" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">VULNERABLE PATH</text><text x="122" y="175" fill="#f9c5b0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Reachability ≠ proof</text></g><path d="M712 338H790" stroke="#5ce0d1" stroke-width="8" stroke-linecap="round"/><path d="M770 320L794 338L770 356" fill="none" stroke="#5ce0d1" stroke-width="8" stroke-linecap="round"/><g transform="translate(815 245)"><rect width="260" height="190" rx="18" fill="#0e4356" stroke="#5ce0d1" stroke-width="3"/><path d="M130 26L172 44V81C172 109 153 126 130 137C107 126 88 109 88 81V44Z" fill="#58dfca"/><path d="M108 82L123 97L151 68" fill="none" stroke="#0b3445" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="164" fill="#efffff" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">PATCH &amp; ISOLATE</text></g><text x="70" y="520" fill="#c8e0eb" font-family="Arial, sans-serif" font-size="22">Impact depends on privileges, configuration, and reachable input paths.</text></svg>
