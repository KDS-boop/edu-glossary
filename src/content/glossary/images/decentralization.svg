<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title>Decentralization</title><desc>The distribution of control and decision-making from a single central authority to many independent participants within a network.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#0b1220"/></linearGradient><radialGradient id="glow"><stop stop-color="#60a5fa" stop-opacity=".25"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="980" cy="300" r="300" fill="url(#glow)"/><rect x="54" y="55" width="1092" height="520" rx="30" fill="none" stroke="#60a5fa" stroke-opacity=".25" stroke-width="2"/><text x="95" y="125" fill="#60a5fa" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">EDUGLOSSARY / BLOCKCHAIN</text><text x="92" y="220" fill="#f8fafc" font-family="Arial,sans-serif" font-size="51" font-weight="800">Decentralization</text><text x="95" y="310" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22">The distribution of control and decision-making from</text><text x="95" y="340" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22">a single central authority to many independent</text><text x="95" y="370" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22">participants within a network.</text><text x="95" y="525" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="1">TECHNOLOGY EXPLAINED CLEARLY</text><path d="M970 205 L860 270" stroke="#60a5fa" stroke-width="4" stroke-opacity=".85"/><path d="M970 205 L1080 270" stroke="#60a5fa" stroke-width="4" stroke-opacity=".85"/><path d="M970 205 L900 370" stroke="#60a5fa" stroke-width="4" stroke-opacity=".85"/><path d="M970 205 L1040 370" stroke="#60a5fa" stroke-width="4" stroke-opacity=".85"/><circle cx="970" cy="205" r="28" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-width="4"/><circle cx="970" cy="205" r="7" fill="#f8fafc"/><circle cx="860" cy="270" r="28" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-width="4"/><circle cx="860" cy="270" r="7" fill="#f8fafc"/><circle cx="1080" cy="270" r="28" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-width="4"/><circle cx="1080" cy="270" r="7" fill="#f8fafc"/><circle cx="900" cy="370" r="28" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-width="4"/><circle cx="900" cy="370" r="7" fill="#f8fafc"/><circle cx="1040" cy="370" r="28" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-width="4"/><circle cx="1040" cy="370" r="7" fill="#f8fafc"/></svg>