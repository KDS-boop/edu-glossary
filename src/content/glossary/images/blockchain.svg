<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title>Blockchain</title><desc>A decentralized digital ledger that records transactions across many computers simultaneously.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#0b1220"/></linearGradient><radialGradient id="glow"><stop stop-color="#60a5fa" stop-opacity=".25"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="980" cy="300" r="300" fill="url(#glow)"/><rect x="54" y="55" width="1092" height="520" rx="30" fill="none" stroke="#60a5fa" stroke-opacity=".25" stroke-width="2"/><text x="95" y="125" fill="#60a5fa" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">EDUGLOSSARY / BLOCKCHAIN</text><text x="92" y="220" fill="#f8fafc" font-family="Arial,sans-serif" font-size="51" font-weight="800">Blockchain</text><text x="95" y="310" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22">A decentralized digital ledger that records</text><text x="95" y="340" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22">transactions across many computers simultaneously.</text><text x="95" y="525" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="1">TECHNOLOGY EXPLAINED CLEARLY</text><g stroke="#60a5fa" stroke-width="3" fill="#ffffff" fill-opacity=".07"><rect x="835" y="165" width="100" height="72" rx="12"/><rect x="1000" y="165" width="100" height="72" rx="12"/><rect x="918" y="310" width="100" height="72" rx="12"/></g><g fill="#f8fafc" font-family="Arial" font-size="20" text-anchor="middle"><text x="885" y="207">Block A</text><text x="1050" y="207">Block B</text><text x="968" y="352">Block C</text></g><path d="M935 202 H990 M981 192 L991 202 L981 212 M1050 240 L995 300 M1004 294 L994 301 L996 288 M918 337 L876 247 M874 258 L875 245 L886 250" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="968" cy="270" r="14" fill="#60a5fa" fill-opacity=".24" stroke="#60a5fa" stroke-width="2"/></svg>