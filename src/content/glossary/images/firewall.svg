<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title>Firewall</title><desc>A network security system that monitors and controls incoming and outgoing data traffic based on predetermined security rules.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e2b"/><stop offset="1" stop-color="#0b1220"/></linearGradient><radialGradient id="glow"><stop stop-color="#34d399" stop-opacity=".25"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="980" cy="300" r="300" fill="url(#glow)"/><rect x="54" y="55" width="1092" height="520" rx="30" fill="none" stroke="#34d399" stroke-opacity=".25" stroke-width="2"/><text x="95" y="125" fill="#34d399" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">EDUGLOSSARY / CYBERSECURITY</text><text x="92" y="220" fill="#f8fafc" font-family="Arial,sans-serif" font-size="51" font-weight="800">Firewall</text><text x="95" y="310" fill="#d1fae5" font-family="Arial,sans-serif" font-size="22">A network security system that monitors and controls</text><text x="95" y="340" fill="#d1fae5" font-family="Arial,sans-serif" font-size="22">incoming and outgoing data traffic based on</text><text x="95" y="370" fill="#d1fae5" font-family="Arial,sans-serif" font-size="22">predetermined security rules.</text><text x="95" y="525" fill="#d1fae5" font-family="Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="1">TECHNOLOGY EXPLAINED CLEARLY</text><path d="M966 145 L1074 185 V270 C1074 336 1025 382 966 412 C907 382 858 336 858 270 V185 Z" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-width="4"/><rect x="921" y="243" width="90" height="77" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#f8fafc" stroke-width="3"/><path d="M940 243 V220 C940 186 992 186 992 220 V243" fill="none" stroke="#f8fafc"