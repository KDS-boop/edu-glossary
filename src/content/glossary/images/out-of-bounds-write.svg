<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Out-of-bounds write</title><desc id="desc">A memory diagram highlights a buffer boundary and a write crossing into adjacent memory.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091b34"/><stop offset="1" stop-color="#193a59"/></linearGradient></defs><rect width="1200" height="630" rx="24" fill="url(#bg)"/><text x="70" y="90" fill="#6fe1d5" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">CYBERSECURITY GLOSSARY</text><text x="70" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Out-of-Bounds Write</text><text x="70" y="215" fill="#b9d8e8" font-family="Arial, sans-serif" font-size="24">Memory-safety boundary violation</text><g transform="translate(100 280)"><text x="0" y="-20" fill="#c5e5f0" font-family="Arial, sans-serif" font-size="20">ALLOCATED BUFFER</text><rect width="640" height="125" rx="14" fill="#123d59" stroke="#55dcd2" stroke-width="4"/><g fill="#52cfc9"><rect x="18" y="18" width="82" height="89" rx="8"/><rect x="112" y="18" width="82" height="89" rx="8"/><rect x="206" y="18" width="82" height="89" rx="8"/><rect x="300" y="18" width="82" height="89" rx="8"/><rect x="394" y="18" width="82" height="89" rx="8"/></g><path d="M497 10V115" stroke="#ffb66e" stroke-width="7" stroke-dasharray="10 8"/><path d="M515 62H590" stroke="#ff876b" stroke-width="8" stroke-linecap="round"/><path d="M574 44L598 62L574 80" fill="none" stroke="#ff876b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="512" y="18" width="110" height="89" rx="8" fill="#673246" stroke="#ff876b" stroke-width="2"/><text x="567" y="57" fill="#fff1e9" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">WRITE</text><text x="567" y="82" fill="#ffc7b1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">OUTSIDE</text></g><text x="100" y="470" fill="#e7f4f8" font-family="Arial, sans-serif" font-size="23">An incorrect index or length can corrupt adjacent memory.</text><text x="100" y="515" fill="#9ac9de" font-family="Arial, sans-serif" font-size="21">Validate bounds • use safe APIs • patch vulnerable libraries</text></svg>
