<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-Augmented Generation (RAG)</title>
  <desc id="desc">A conceptual RAG flow: a user query retrieves relevant knowledge, the selected context is added to the prompt, and a language model generates a grounded answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="40" y="36" width="1120" height="558" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="80" y="105" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#0f172a">Retrieval-Augmented Generation (RAG)</text>
  <text x="80" y="150" font-family="system-ui,sans-serif" font-size="22" fill="#475569">Grounding an AI answer in external, relevant information</text>
  <g font-family="system-ui,sans-serif" fill="#0f172a" text-anchor="middle">
    <rect x="70" y="230" width="210" height="160" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/>
    <circle cx="175" cy="270" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <path d="M167 270h16M175 262v16" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="175" y="325" font-size="23" font-weight="700">User query</text>
    <text x="175" y="357" font-size="17" fill="#475569">Ask a question</text>
    <rect x="340" y="230" width="210" height="160" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/>
    <path d="M420 260h52v40h-52zM428 270h36M428 280h28M428 290h32" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="445" y="325" font-size="23" font-weight="700">Retrieve</text>
    <text x="445" y="357" font-size="17" fill="#475569">Find relevant sources</text>
    <rect x="610" y="230" width="210" height="160" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/>
    <path d="M686 258h58v45h-58zM698 270h34M698 280h28M698 290h22" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="715" y="325" font-size="23" font-weight="700">Add context</text>
    <text x="715" y="357" font-size="17" fill="#475569">Enrich the prompt</text>
    <rect x="880" y="230" width="210" height="160" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/>
    <path d="M958 260h54v42h-54zM968 272h34M968 282h24M968 292h29" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="985" y="325" font-size="22" font-weight="700">Generate</text>
    <text x="985" y="357" font-size="17" fill="#475569">Grounded response</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M290 310h40"/>
    <path d="M560 310h40"/>
    <path d="M830 310h40"/>
  </g>
  <rect x="80" y="440" width="1040" height="64" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="480" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#166534">The model receives source context before it generates its answer</text>
  <text x="80" y="550" font-family="system-ui,sans-serif" font-size="20" fill="#475569">EduGlossary · Conceptual overview</text>
</svg>