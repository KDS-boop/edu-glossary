<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">eMudhra Certificate Authority Incident — October 2026</title>
  <desc id="desc">An educational diagram showing a root certificate, an intermediate certificate with a warning, a website certificate, and the steps to revoke trust and reissue an affected certificate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1060" cy="95" r="170" fill="#0e7490" opacity=".16"/>
  <rect x="42" y="38" width="1116" height="552" rx="26" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="78" y="98" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#f8fafc">WHEN A CERTIFICATE AUTHORITY KEY IS COMPROMISED</text>
  <text x="80" y="137" font-family="system-ui,sans-serif" font-size="21" fill="#cbd5e1">eMudhra incident · Trust chains · HTTPS identity</text>
  <rect x="86" y="190" width="260" height="138" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="216" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#dbeafe">Root CA</text>
  <text x="216" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#bfdbfe">Trust anchor</text>
  <text x="216" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#bfdbfe">Browser / OS store</text>
  <path d="M350 260 L454 260" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="463" y="182" width="280" height="154" rx="18" fill="#431407" stroke="#fb923c" stroke-width="3"/>
  <text x="603" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ffedd5">Intermediate CA</text>
  <text x="603" y="259" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#fed7aa">Private key compromised</text>
  <rect x="510" y="280" width="186" height="34" rx="10" fill="url(#alert)"/>
  <text x="603" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#fff">REVOKE TRUST</text>
  <path d="M748 260 L848 260" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="856" y="190" width="260" height="138" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
  <text x="986" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#d1fae5">Website TLS</text>
  <text x="986" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#a7f3d0">Leaf certificate</text>
  <text x="986" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a7f3d0">Verify actual chain</text>
  <path d="M216 348 L216 389 L603 389 L603 348" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 8"/>
  <rect x="104" y="413" width="992" height="78" rx="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="447" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#f8fafc">CHECK THE CHAIN · REISSUE · TEST WITH VALIDATION ON</text>
  <text x="600" y="474" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#cbd5e1">Do not bypass browser warnings or disable TLS verification</text>
  <text x="80" y="550" font-family="system-ui,sans-serif" font-size="16" fill="#94a3b8">EduGlossary · Incident status checked 22 October 2026</text>
</svg>