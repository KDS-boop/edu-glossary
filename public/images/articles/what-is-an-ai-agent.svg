<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>How an AI Agent Works</title><desc>A goal-directed agent reasons, plans, uses tools, observes results, and iterates until it reaches a result.</desc><rect width="1200" height="630" fill="#f8fafc"/><rect x="40" y="36" width="1120" height="558" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="80" y="105" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#0f172a">How an AI Agent Works</text><rect x="80.0" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="156.7" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Goal</text><path d="M 238.3 310 L 252.3 310" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="257.3" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="334.0" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Reason / Plan</text><path d="M 415.7 310 L 429.7 310" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="434.7" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="511.3" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Use Tool</text><path d="M 593.0 310 L 607.0 310" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="612.0" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="688.7" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Observe</text><path d="M 770.3 310 L 784.3 310" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="789.3" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="866.0" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Iterate</text><path d="M 947.7 310 L 961.7 310" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="966.7" y="235" width="153.3" height="150" rx="18" fill="#f1f5f9" stroke="#15803d" stroke-width="3"/><text x="1043.3" y="300" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Result</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="80" y="530" font-family="system-ui,sans-serif" font-size="20" fill="#475569">EduGlossary · Conceptual overview</text></svg>