<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenSSL 4.1.0 release and migration guide</title>
  <desc id="desc">OpenSSL 4.1.0 introduces DTLS 1.3 support. The graphic highlights protocol support, cryptographic optimizations, compatibility testing, and staged migration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b35"/><stop offset="1" stop-color="#173c55"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#65e6d2"/><stop offset="1" stop-color="#4aa4ff"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1040" cy="92" r="180" fill="#61dfd0" opacity=".08"/><circle cx="1040" cy="92" r="120" fill="none" stroke="#61dfd0" stroke-opacity=".24" stroke-width="2"/>
  <g transform="translate(78 78)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#65e6d2" fill-opacity=".15" stroke="#65e6d2" stroke-opacity=".55"/>
    <text x="95" y="23" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2" fill="#94f4e4">RELEASE GUIDE</text>
    <text x="0" y="107" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff">OpenSSL 4.1.0</text>
    <text x="2" y="154" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#c9d9ec">DTLS 1.3 • Cryptographic updates</text>
    <text x="2" y="193" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#93abc5">Released 23 October 2026</text>
    <g transform="translate(0 253)">
      <rect width="262" height="106" rx="17" fill="#ffffff" fill-opacity=".065" stroke="#ffffff" stroke-opacity=".16"/>
      <path d="M26 29h34v34H26zM34 29v-8a9 9 0 0 1 18 0v8" stroke="#65e6d2" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="80" y="42" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">DTLS 1.3</text><text x="80" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c0d0e3">Datagram security</text>
    </g>
    <g transform="translate(282 253)">
      <rect width="262" height="106" rx="17" fill="#ffffff" fill-opacity=".065" stroke="#ffffff" stroke-opacity=".16"/>
      <path d="M24 49l12-14 12 14 12-14" stroke="#65e6d2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="42" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Crypto</text><text x="80" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c0d0e3">Implementation updates</text>
    </g>
    <g transform="translate(564 253)">
      <rect width="262" height="106" rx="17" fill="#ffffff" fill-opacity=".065" stroke="#ffffff" stroke-opacity=".16"/>
      <path d="M27 29l18 0 13 13-13 13H27z" fill="none" stroke="#65e6d2" stroke-width="3" stroke-linejoin="round"/><path d="M34 42h14" stroke="#65e6d2" stroke-width="3"/>
      <text x="80" y="42" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Migration</text><text x="80" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c0d0e3">Test before rollout</text>
    </g>
  </g>
  <g transform="translate(965 250)">
    <circle cx="78" cy="78" r="73" fill="#65e6d2" fill-opacity=".12" stroke="url(#accent)" stroke-width="3"/>
    <path d="M78 33l37 15v28c0 26-16 43-37 53-21-10-37-27-37-53V48z" fill="none" stroke="#8ff5e7" stroke-width="5" stroke-linejoin="round"/>
    <path d="M59 77l13 13 26-29" fill="none" stroke="#8ff5e7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#c9d9ec" text-anchor="middle" letter-spacing="2">VERIFY</text>
    <text x="78" y="215" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c9d9ec" text-anchor="middle">Actual runtime</text>
  </g>
  <text x="80" y="582" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8da5bd">EDUGLOSSARY  /  CYBERSECURITY</text>
  <text x="1120" y="582" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8da5bd" text-anchor="end">1200 × 630</text>
</svg>