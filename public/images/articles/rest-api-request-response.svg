<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">REST API: Request to Response</title>
  <desc id="desc">A client sends an HTTP request such as GET /users/123 to a REST API server, which processes it and returns an HTTP response with a JSON body. Standard methods include GET, POST, PUT, PATCH, and DELETE.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="40" y="36" width="1120" height="558" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="80" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#0f172a">REST API: Request → Response</text>
  <text x="80" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#475569">A client sends an HTTP request and receives a JSON response</text>
  <g>
    <rect x="60" y="200" width="192" height="115" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <circle cx="84" cy="224" r="14" fill="#1e40af"/>
    <text x="84" y="229" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="156" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
    <text x="156" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">web · mobile · AI agent</text>
  </g>
  <path d="M 256 257 L 278 257" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="282" y="200" width="192" height="115" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <circle cx="306" cy="224" r="14" fill="#1e40af"/>
    <text x="306" y="229" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="378" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">HTTP Request</text>
    <text x="378" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">GET /users/123</text>
  </g>
  <path d="M 478 257 L 500 257" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="504" y="200" width="192" height="115" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <circle cx="528" cy="224" r="14" fill="#1e40af"/>
    <text x="528" y="229" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="600" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">REST API Server</text>
    <text x="600" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">processes the request</text>
  </g>
  <path d="M 700 257 L 722 257" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="726" y="200" width="192" height="115" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <circle cx="750" cy="224" r="14" fill="#1e40af"/>
    <text x="750" y="229" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="822" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">HTTP Response</text>
    <text x="822" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">200 OK · JSON body</text>
  </g>
  <path d="M 922 257 L 944 257" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="948" y="200" width="192" height="115" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <circle cx="972" cy="224" r="14" fill="#1e40af"/>
    <text x="972" y="229" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1044" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
    <text x="1044" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">renders the data</text>
  </g>
  <line x1="80" y1="362" x2="1120" y2="362" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="398" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1e40af">Standard HTTP methods (CRUD)</text>
  <g>
    <rect x="60" y="418" width="192" height="92" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="156" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">GET</text>
    <text x="156" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">retrieve data</text>
  </g>
  <g>
    <rect x="282" y="418" width="192" height="92" rx="14" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <text x="378" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">POST</text>
    <text x="378" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">create a resource</text>
  </g>
  <g>
    <rect x="504" y="418" width="192" height="92" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="600" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">PUT</text>
    <text x="600" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">replace a resource</text>
  </g>
  <g>
    <rect x="726" y="418" width="192" height="92" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
    <text x="822" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#7e22ce" text-anchor="middle">PATCH</text>
    <text x="822" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">partial update</text>
  </g>
  <g>
    <rect x="948" y="418" width="192" height="92" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1044" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">DELETE</text>
    <text x="1044" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">remove a resource</text>
  </g>
  <text x="80" y="572" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#64748b">EduGlossary · Software Development</text>
</svg>
