<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="100" y="50" width="600" height="100" fill="#4a90e2" rx="10" ry="10"/>
  <text x="110" y="90" font-family="sans-serif" font-size="24" fill="#fff" dominant-baseline="middle" text-anchor="middle">Cloud Infrastructure</text>
  <line x1="400" y1="150" x2="400" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="250" font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle">Data Flow</text>
  <g transform="translate(400, 350)">
    <g transform="scale(0.5)">
      <rect x="-50" y="-50" width="100" height="100" fill="#e63946" rx="10" ry="10"/>
      <text x="0" y="50" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">Edge Node</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="-50" y="-50" width="100" height="100" fill="#f1c40f" rx="10" ry="10"/>
      <text x="0" y="50" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle">Gateway</text>
    </g>
    <g transform="translate(-150, 0)">
      <rect x="-50" y="-50" width="100" height="100" fill="#2ecc71" rx="10" ry="10"/>
      <text x="0" y="50" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">Sensor</text>
    </g>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
  </defs>
</svg>