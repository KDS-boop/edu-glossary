<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Edge Computing Architecture</title>
  <desc id="desc">Cloud infrastructure sends data to an edge node, gateway, and sensor for local processing, protocol translation, and data collection.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .label { font-family: sans-serif; font-size: 23px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .label-dark { fill: #1a1a2e; }
      .caption { font-family: sans-serif; font-size: 17px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
      .caption-dark { fill: #1a1a2e; }
      .title-text { font-family: sans-serif; font-size: 32px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .flow-text { font-family: sans-serif; font-size: 21px; fill: #334155; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
      .connector { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <rect x="120" y="35" width="960" height="95" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="83" class="title-text">Cloud Infrastructure</text>

  <path d="M600 130 V205" class="connector" marker-end="url(#arrowhead)"/>
  <text x="600" y="170" class="flow-text">Data Flow</text>
  <path d="M200 235 H1000" class="connector"/>
  <path d="M200 235 V315" class="connector" marker-end="url(#arrowhead)"/>
  <path d="M600 235 V315" class="connector" marker-end="url(#arrowhead)"/>
  <path d="M1000 235 V315" class="connector" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="110" y="325" width="180" height="150" rx="14" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <text x="200" y="385" class="label">Edge Node</text>
    <text x="200" y="430" class="caption">Local Processing</text>
  </g>

  <g>
    <rect x="510" y="325" width="180" height="150" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="600" y="385" class="label label-dark">Gateway</text>
    <text x="600" y="430" class="caption caption-dark">Protocol Translation</text>
  </g>

  <g>
    <rect x="910" y="325" width="180" height="150" rx="14" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <text x="1000" y="385" class="label">Sensor</text>
    <text x="1000" y="430" class="caption">Data Collection</text>
  </g>

  <text x="600" y="555" class="flow-text" style="font-size:20px; fill:#64748b;">Edge Computing: Local processing close to data sources</text>
</svg>
